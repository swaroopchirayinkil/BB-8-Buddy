<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#11998e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05332e" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e8ecf1"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </radialGradient>
    <radialGradient id="orangeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="85%" stop-color="#ee5253"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <filter id="droidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="114" rx="34" ry="5" fill="#000000" opacity="0.2"/>

  <!-- BB-8 Spherical Body -->
  <g id="body" filter="url(#droidShadow)">
    <circle cx="50" cy="74" r="38" fill="url(#bodyGrad)" stroke="#cfd8dc" stroke-width="1.5"/>

    <!-- Central Orange Ring Pattern -->
    <circle cx="50" cy="74" r="23" fill="none" stroke="url(#orangeGrad)" stroke-width="7"/>
    <circle cx="50" cy="74" r="16" fill="#f8fafc" stroke="#90a4ae" stroke-width="1"/>
    <!-- Internal Tech Center -->
    <circle cx="50" cy="74" r="8" fill="#455a64"/>
    <circle cx="50" cy="74" r="4" fill="#cfd8dc"/>
    <rect x="48.5" y="62" width="3" height="24" fill="#90a4ae"/>
    <rect x="38" y="72.5" width="24" height="3" fill="#90a4ae"/>

    <!-- Side Orange Panel Arcs -->
    <path d="M 16 58 A 38 38 0 0 1 28 42" stroke="url(#orangeGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 72 42 A 38 38 0 0 1 84 58" stroke="url(#orangeGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 20 95 A 38 38 0 0 0 35 107" stroke="url(#orangeGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 65 107 A 38 38 0 0 0 80 95" stroke="url(#orangeGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Seam Lines -->
    <circle cx="50" cy="74" r="31" fill="none" stroke="#b0bec5" stroke-width="0.8" stroke-dasharray="8 4"/>
  </g>

  <!-- BB-8 Dome Head -->
  <g id="head" filter="url(#droidShadow)">
    <!-- Antennas -->
    <line x1="61" y1="23" x2="61" y2="9" stroke="#90a4ae" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="66" y1="24" x2="66" y2="15" stroke="#78909c" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="61" cy="9" r="1" fill="#ee5253"/>

    <!-- Head Dome -->
    <path d="M 28 35 A 22 20 0 0 1 72 35 Z" fill="url(#bodyGrad)" stroke="#cfd8dc" stroke-width="1.2"/>
    <!-- Orange Head Stripe -->
    <path d="M 30 31 Q 50 30 70 31" stroke="url(#orangeGrad)" stroke-width="3" fill="none"/>
    <path d="M 33 22 Q 50 20 67 22" stroke="url(#orangeGrad)" stroke-width="2.5" fill="none"/>

    <!-- Large Primary Photoreceptor (Eye) -->
    <circle cx="50" cy="27" r="7.5" fill="#1e272e" stroke="#cfd8dc" stroke-width="1"/>
    <circle cx="50" cy="27" r="5.2" fill="url(#lensGlow)"/>
    <circle cx="48" cy="25" r="1.8" fill="#ffffff" opacity="0.8"/>

    <!-- Secondary Small Sensor Light -->
    <circle cx="61" cy="30" r="2.8" fill="#2d3436" stroke="#b0bec5" stroke-width="0.6"/>
    <circle cx="61" cy="30" r="1.6" fill="#0984e3"/>
    <circle cx="60.5" cy="29.5" r="0.6" fill="#ffffff" opacity="0.9"/>

    <!-- Head Base Trim / Neck Plate -->
    <ellipse cx="50" cy="35.5" rx="22" ry="3" fill="#607d8b"/>
  </g>
</svg>
