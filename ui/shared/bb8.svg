<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- Retro Cel-Shaded BB-8 Vector Art matching user reference illustration -->
  <defs>
    <!-- CRT glow filter -->
    <filter id="retroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#ffaa00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="50" cy="115" rx="32" ry="4" fill="#0d1217" opacity="0.35"/>

  <!-- BB-8 Spherical Body -->
  <g id="body">
    <!-- Main Shell -->
    <circle cx="50" cy="74" r="38" fill="#f8fafc" stroke="#2f3542" stroke-width="2.2"/>

    <!-- Seam Lines -->
    <path d="M 12 74 A 38 38 0 0 0 50 112" fill="none" stroke="#a4b0be" stroke-width="1.2"/>
    <path d="M 50 36 A 38 38 0 0 0 88 74" fill="none" stroke="#a4b0be" stroke-width="1.2"/>

    <!-- Side Arc Panels -->
    <!-- Left Orange Arc -->
    <path d="M 14 62 A 38 38 0 0 1 26 44" fill="none" stroke="#f58220" stroke-width="7" stroke-linecap="round"/>
    <path d="M 14 62 A 38 38 0 0 1 26 44" fill="none" stroke="#2f3542" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
    <!-- Right Orange Arc -->
    <path d="M 74 44 A 38 38 0 0 1 86 62" fill="none" stroke="#f58220" stroke-width="7" stroke-linecap="round"/>
    <!-- Bottom Orange Arc -->
    <path d="M 58 111 A 38 38 0 0 1 78 100" fill="none" stroke="#f58220" stroke-width="7" stroke-linecap="round"/>

    <!-- Central Disc Assembly -->
    <g id="centerDisc">
      <!-- Outer Orange Ring -->
      <circle cx="50" cy="74" r="23" fill="#f58220" stroke="#2f3542" stroke-width="1.8"/>

      <!-- Inner Ivory Channel -->
      <circle cx="50" cy="74" r="17.5" fill="#f8fafc" stroke="#2f3542" stroke-width="1.5"/>

      <!-- Grey Mechanical Wedge Panels (Quadrant Inserts) -->
      <!-- Top-right grey arc -->
      <path d="M 50 56.5 A 17.5 17.5 0 0 1 67.5 74 L 60.5 74 A 10.5 10.5 0 0 0 50 63.5 Z" fill="#8c929a" stroke="#2f3542" stroke-width="1"/>
      <!-- Bottom-left grey arc with gauge ticks -->
      <path d="M 50 91.5 A 17.5 17.5 0 0 1 32.5 74 L 39.5 74 A 10.5 10.5 0 0 0 50 84.5 Z" fill="#8c929a" stroke="#2f3542" stroke-width="1"/>
      <!-- Gauge ticks -->
      <line x1="42" y1="84" x2="44" y2="81" stroke="#ffffff" stroke-width="0.8"/>
      <line x1="45" y1="86" x2="46.5" y2="83" stroke="#ffffff" stroke-width="0.8"/>
      <line x1="48" y1="87" x2="49" y2="84" stroke="#ffffff" stroke-width="0.8"/>

      <!-- Small grey circular port (top-left) -->
      <circle cx="41.5" cy="65.5" r="1.8" fill="#747d8c" stroke="#2f3542" stroke-width="0.8"/>
      <circle cx="41.5" cy="65.5" r="0.6" fill="#2f3542"/>

      <!-- 4 Orange Radial Connecting Spokes -->
      <rect x="48" y="56.5" width="4" height="7" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="48" y="84.5" width="4" height="7" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="32.5" y="72" width="7" height="4" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="60.5" y="72" width="7" height="4" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>

      <!-- Spoke Pin Dots -->
      <circle cx="50" cy="60" r="0.8" fill="#2f3542"/>
      <circle cx="50" cy="88" r="0.8" fill="#2f3542"/>
      <circle cx="36" cy="74" r="0.8" fill="#2f3542"/>
      <circle cx="64" cy="74" r="0.8" fill="#2f3542"/>

      <!-- Concentric Center Hub -->
      <circle cx="50" cy="74" r="10.5" fill="#f8fafc" stroke="#2f3542" stroke-width="1.2"/>
      <circle cx="50" cy="74" r="7" fill="#747d8c" stroke="#2f3542" stroke-width="1"/>
      <circle cx="50" cy="74" r="4" fill="#f8fafc" stroke="#2f3542" stroke-width="0.8"/>
      <circle cx="50" cy="74" r="1" fill="#2f3542"/>

      <!-- Perimeter Rivets -->
      <circle cx="50" cy="53" r="0.9" fill="#57606f"/>
      <circle cx="50" cy="95" r="0.9" fill="#57606f"/>
      <circle cx="29" cy="74" r="0.9" fill="#57606f"/>
      <circle cx="71" cy="74" r="0.9" fill="#57606f"/>
      <circle cx="35" cy="59" r="0.9" fill="#57606f"/>
      <circle cx="65" cy="59" r="0.9" fill="#57606f"/>
      <circle cx="35" cy="89" r="0.9" fill="#57606f"/>
      <circle cx="65" cy="89" r="0.9" fill="#57606f"/>
    </g>

    <!-- Outer Body Rivets -->
    <circle cx="45" cy="40" r="1.1" fill="#747d8c" stroke="#2f3542" stroke-width="0.6"/>
    <circle cx="72" cy="50" r="1.1" fill="#747d8c" stroke="#2f3542" stroke-width="0.6"/>
    <circle cx="25" cy="90" r="1.1" fill="#747d8c" stroke="#2f3542" stroke-width="0.6"/>
    <circle cx="56" cy="106" r="1.1" fill="#747d8c" stroke="#2f3542" stroke-width="0.6"/>
  </g>

  <!-- BB-8 Dome Head -->
  <g id="head">
    <!-- Antennas -->
    <!-- Tall Right Antenna with Stepped Tip -->
    <rect x="52" y="7" width="1.6" height="15" fill="#ced6e0" stroke="#2f3542" stroke-width="0.8"/>
    <rect x="51.2" y="3" width="3.2" height="4" fill="#747d8c" stroke="#2f3542" stroke-width="0.8"/>
    <line x1="52.8" y1="3" x2="52.8" y2="0" stroke="#2f3542" stroke-width="0.9"/>

    <!-- Short Left Antenna -->
    <rect x="47" y="12" width="1.4" height="10" fill="#ced6e0" stroke="#2f3542" stroke-width="0.8"/>

    <!-- Neck Collar Bevel Base -->
    <polygon points="27,38 73,38 70,41 30,41" fill="#8c929a" stroke="#2f3542" stroke-width="1.4"/>

    <!-- Dome Body -->
    <path d="M 27 38 A 23 21 0 0 1 73 38 Z" fill="#f8fafc" stroke="#2f3542" stroke-width="2"/>

    <!-- Grey Top Cap (Clipped) -->
    <path d="M 36 21 A 23 21 0 0 1 64 21 Z" fill="#8c929a" stroke="#2f3542" stroke-width="1.2"/>

    <!-- Horizontal Trim Stripes -->
    <path d="M 33 23 Q 50 21 67 23" stroke="#8c929a" stroke-width="1.8" fill="none"/>
    <path d="M 30 25 Q 50 23 70 25" stroke="#2f3542" stroke-width="0.8" fill="none"/>

    <!-- Tech Plate next to eye -->
    <rect x="43" y="24" width="7" height="10" fill="#cfd8dc" stroke="#2f3542" stroke-width="1"/>
    <rect x="44" y="28" width="2" height="3" fill="#8c929a"/>
    <circle cx="48" cy="32" r="1" fill="#2f3542"/>

    <!-- Lower Orange Blocks on Head -->
    <g id="headOrangeBlocks">
      <rect x="30.5" y="34" width="3.5" height="3.5" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="35.5" y="34" width="3.5" height="3.5" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="40.5" y="34" width="2.5" height="3.5" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="66" y="34" width="3.5" height="3.5" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
      <rect x="62" y="34" width="2.5" height="3.5" fill="#f58220" stroke="#2f3542" stroke-width="0.8"/>
    </g>

    <!-- Main Optical Eye Lens -->
    <!-- Bezel -->
    <circle cx="50" cy="27" r="7.2" fill="#ced6e0" stroke="#2f3542" stroke-width="1.4"/>
    <!-- Dark Optical Lens -->
    <circle cx="50" cy="27" r="5.4" fill="#11141a" stroke="#2f3542" stroke-width="1"/>
    <!-- Specular Highlight Glint -->
    <circle cx="52.2" cy="25" r="1.8" fill="#ffffff"/>

    <!-- Secondary Small Optical Sensor (Lower Right) -->
    <circle cx="60.5" cy="30" r="3.2" fill="#ced6e0" stroke="#2f3542" stroke-width="1"/>
    <circle cx="60.5" cy="30" r="2.2" fill="#00a8ff" stroke="#2f3542" stroke-width="0.8"/>
    <circle cx="61.2" cy="29.3" r="0.7" fill="#ffffff"/>
  </g>
</svg>
